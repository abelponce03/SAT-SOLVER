requiere = ["results/exp017/banco.txt", "solver/kissat/build-fma/kissat"]
hecho = "n=$(lineas_lista results/exp017/banco.txt); [ $(filas results/exp017/control_A.csv) -ge $n ] && [ $(filas results/exp017/control_B.csv) -ge $n ] && [ -f results/exp017/informe-control.md ]"
comando = """
