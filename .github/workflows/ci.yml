name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build + corrección (gcc release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas externas (drat-trim, satsuma, dsr-trim)
        run: ./scripts/get_tools.sh --jobs 4
      - name: Suite de humo (build, tests de Kissat, modelos, pruebas DRAT, determinismo)
        run: ./scripts/smoke_test.sh
      - name: Tubería de simetrías (satsuma → kissat, pruebas SR con dsr-trim)
        run: ./scripts/test_symmetry.sh

  sanitize:
    name: Build con sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con ASan/UBSan
        run: ./scripts/build.sh --clean --sanitize
      - name: Resolver el banco de humo bajo sanitizers
        run: |
          # Cualquier lectura fuera de rango o desbordamiento en nuestros
          # parches aborta aquí, antes de contaminar una medición de PAR-2.
          # GitHub ejecuta los pasos con 'bash -e'. Los códigos 10 y 20
          # (SAT/UNSAT) son salidas NORMALES en DIMACS, así que con errexit el
          # paso aborta en la primera instancia en vez de llegar al 'case'.
          set +e
          set -u
          fail=0
          for f in bench/smoke/*.cnf; do
            ./solver/kissat/build/kissat -q -n "$f" >/dev/null 2>&1
            code=$?
            case "$code" in
              10|20) ;;
              *) echo "FALLO en $f (código $code)"; fail=1 ;;
            esac
          done
          exit $fail

  clang:
    name: Build con clang (portabilidad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con clang
        run: CC=clang ./scripts/build.sh --clean
      - name: Comprobación rápida
        run: ./scripts/smoke_test.sh --quick

  entrega:
    name: Build de competición (la configuración que se entrega)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con --competition
        # Es la configuración con la que los organizadores construyen el
        # binario: '--no-options --quiet'. Compila las opciones FUERA del
        # binario, así que hay que verificarla aparte: un cambio que solo
        # funcione activando una opción en tiempo de ejecución NO llega a la
        # competición (ver ADR-0002 §3).
        run: ./scripts/build.sh --clean --competition
      - name: Comprobar que responde correctamente
        run: |
          set +e   # ver la nota sobre 'bash -e' en el trabajo de sanitizers
          set -u
          fail=0
          # Este binario NO acepta -q, -s ni --seed: están compilados fuera.
          # Solo -n, --time y --conflicts sobreviven.
          while IFS=, read -r inst expected _note; do
            [ "$inst" = "instance" ] && continue
            ./solver/kissat/build/kissat -n "bench/smoke/$inst" >/dev/null 2>&1
            case "$?" in 10) got=SAT ;; 20) got=UNSAT ;; *) got="error" ;; esac
            if [ "$got" != "$expected" ]; then
              echo "FALLO $inst: esperado $expected, obtenido $got"; fail=1
            fi
          done < bench/smoke/expected.csv
          exit $fail
      - name: Tubería de simetrías con el binario de competición
        # '--append-proof' es una opción de la aplicación, no del solver: debe
        # sobrevivir a '--no-options' o la prueba entregada sería inválida.
        run: |
          ./scripts/get_tools.sh --jobs 4
          ./scripts/test_symmetry.sh

  scripts:
    name: Scripts de análisis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sintaxis
        run: python3 -m compileall -q scripts/
      - name: El analizador funciona de punta a punta
        run: |
          ./scripts/build.sh
          python3 scripts/run_experiment.py --solver solver/kissat/build/kissat \
            --bench bench/smoke --out /tmp/a.csv --timeout 10 --seeds 1,2 --label A
          python3 scripts/par2.py /tmp/a.csv --by-family
          python3 scripts/par2.py /tmp/a.csv /tmp/a.csv --md
