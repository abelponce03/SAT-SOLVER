name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build + corrección (gcc release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas externas (drat-trim, satsuma, dsr-trim)
        run: ./scripts/get_tools.sh --jobs 4
      - name: Suite de humo (build, tests de Kissat, modelos, pruebas DRAT, determinismo)
        run: ./scripts/smoke_test.sh
      - name: Tubería de simetrías (satsuma → kissat, pruebas SR con dsr-trim)
        run: ./scripts/test_symmetry.sh
      - name: mclique (clique máxima MIT, D-005)
        run: ./scripts/test_mclique.sh
      - name: Tubería de simetrías con satsuma-mclique
        run: LABESAT_SATSUMA="$PWD/tools/satsuma-mclique" ./scripts/test_symmetry.sh

  simetrias-integradas:
    name: Ruptura de simetrías integrada en Kissat (D-016)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: satsuma vendorizado = upstream fijado, sin modificar
        run: ./scripts/vendor_satsuma.sh --check
      - name: Herramientas externas (satsuma de referencia, dsr-trim, drat-trim)
        run: ./scripts/get_tools.sh --jobs 4
      - name: Compilar con --symmetry
        run: ./scripts/build.sh --dir=build-symm --symmetry
      - name: Equivalencia con satsuma externo, pruebas SR y respaldo
        run: |
          ./scripts/build.sh >/dev/null   # binario sin soporte, para el control
          ./scripts/test_symmetry_integrada.sh solver/kissat/build-symm/kissat
      - name: Build de competición con --symmetry
        run: |
          ./scripts/build.sh --dir=build-comp-symm --competition --symmetry
          set +e
          K=solver/kissat/build-comp-symm/kissat
          $K --symmetry bench/symm/php_12_11.cnf /tmp/c.proof >/dev/null
          [ $? = 20 ] || { echo "no responde UNSAT"; exit 1; }
          for d in tools/dsr-trim tools/dsr-trim-sc2026; do
            $d bench/symm/php_12_11.cnf /tmp/c.proof | grep -aq '^s VERIFIED' || { echo "$d rechaza la prueba"; exit 1; }
          done

  sanitize:
    name: Build con sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con ASan/UBSan
        run: ./scripts/build.sh --clean --sanitize
      - name: Resolver el banco de humo bajo sanitizers
        run: |
          # Cualquier lectura fuera de rango o desbordamiento en nuestros
          # parches aborta aquí, antes de contaminar una medición de PAR-2.
          # GitHub ejecuta los pasos con 'bash -e'. Los códigos 10 y 20
          # (SAT/UNSAT) son salidas NORMALES en DIMACS, así que con errexit el
          # paso aborta en la primera instancia en vez de llegar al 'case'.
          set +e
          set -u
          fail=0
          for f in bench/smoke/*.cnf; do
            ./solver/kissat/build/kissat -q -n "$f" >/dev/null 2>&1
            code=$?
            case "$code" in
              10|20) ;;
              *) echo "FALLO en $f (código $code)"; fail=1 ;;
            esac
          done
          exit $fail

  clang:
    name: Build con clang (portabilidad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con clang
        run: CC=clang ./scripts/build.sh --clean
      - name: Comprobación rápida
        run: ./scripts/smoke_test.sh --quick

  entrega:
    name: Build de competición (la configuración que se entrega)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con --competition
        # Es la configuración con la que los organizadores construyen el
        # binario: '--no-options --quiet'. Compila las opciones FUERA del
        # binario, así que hay que verificarla aparte: un cambio que solo
        # funcione activando una opción en tiempo de ejecución NO llega a la
        # competición (ver ADR-0002 §3).
        run: ./scripts/build.sh --clean --competition
      - name: Comprobar que responde correctamente
        run: |
          set +e   # ver la nota sobre 'bash -e' en el trabajo de sanitizers
          set -u
          fail=0
          # Este binario NO acepta -q, -s ni --seed: están compilados fuera.
          # Solo -n, --time y --conflicts sobreviven.
          while IFS=, read -r inst expected _note; do
            [ "$inst" = "instance" ] && continue
            ./solver/kissat/build/kissat -n "bench/smoke/$inst" >/dev/null 2>&1
            case "$?" in 10) got=SAT ;; 20) got=UNSAT ;; *) got="error" ;; esac
            if [ "$got" != "$expected" ]; then
              echo "FALLO $inst: esperado $expected, obtenido $got"; fail=1
            fi
          done < bench/smoke/expected.csv
          exit $fail
      - name: Tubería de simetrías con el binario de competición
        # '--append-proof' es una opción de la aplicación, no del solver: debe
        # sobrevivir a '--no-options' o la prueba entregada sería inválida.
        run: |
          ./scripts/get_tools.sh --jobs 4
          ./scripts/test_symmetry.sh

  autoria:
    name: Autoría (ADR-0005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sin coautorías de herramientas en los commits nuevos
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          ./scripts/check_authorship.sh "$base..HEAD"

  documentacion:
    name: Documentación (LaTeX → PDF, página man)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # declaracion_ia.sh compara contra la base del fork
      - name: Cifras de la declaración de IA (plan Main Track §5)
        # Falla si un fichero modificado de Kissat está sin clasificar como
        # activo o inactivo: la cifra declarada nunca puede quedar desfasada.
        run: ./scripts/declaracion_ia.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Instalar TeX Live y groff
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends latexmk \
            texlive-latex-recommended texlive-latex-extra texlive-lang-spanish \
            texlive-fonts-recommended texlive-publishers lmodern groff >/dev/null
      - name: Compilar los PDF
        run: |
          set -e
          for tex in docs/manual/manual-usuario.tex docs/competicion/descripcion-solver.tex; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error -cd "$tex"
          done
      - name: Validar la página man
        run: |
          out=$(groff -k -man -Tutf8 -ww docs/man/labesat.1 2>&1 >/dev/null)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: documentacion-pdf
          path: |
            docs/manual/*.pdf
            docs/competicion/*.pdf

  scripts:
    name: Scripts de análisis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sintaxis
        run: python3 -m compileall -q scripts/
      - name: El analizador funciona de punta a punta
        run: |
          ./scripts/build.sh
          python3 scripts/run_experiment.py --solver solver/kissat/build/kissat \
            --bench bench/smoke --out /tmp/a.csv --timeout 10 --seeds 1,2 --label A
          python3 scripts/par2.py /tmp/a.csv --by-family
          python3 scripts/par2.py /tmp/a.csv /tmp/a.csv --md
